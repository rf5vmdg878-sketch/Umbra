[package]
name = "unichat-seal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone offline file encryption: X-Wing (ML-KEM-768 + X25519) + AES-256-GCM, Argon2id-protected keys."

[[bin]]
name = "unichat-seal"
path = "src/main.rs"

[dependencies]
unichat-core = { path = "../core" }
zeroize.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
