[package]
name = "umbra-build"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform build/package tool for the Umbra app and relay (non-Tor default; --torify for the Tor-hardened variant)."

[[bin]]
name = "umbra-build"
path = "src/main.rs"

# Intentionally std-only (no dependencies): the bootstrap scripts build this
# first, before SymCrypt is present, so it must not link the crypto core.
[dependencies]
